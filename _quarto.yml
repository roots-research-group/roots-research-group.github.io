project:
  type: website
  output-dir: _html
  render:
    - ./*.qmd
    - ./events/**/*.qmd

website:
  announcement: 
    icon: patch-question-fill
    dismissable: false
    content: "**RootS Community Survey** Share your thoughts on the future of soil–vegetation–atmosphere research and practice! Click [here](https://forms.gle/3cDq1zjuPjfaVEXMA) to take the survey."
    type: warning
    position: below-navbar
  favicon: "/metafiles/logo.jpg"
  search: 
    location: navbar
    type: overlay
  title: "RootS Research Group"
  page-footer: 
    background: light
    center: |
      Unless stated otherwise, published under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode). 
    left: |
      ![](http://mirrors.creativecommons.org/presskit/buttons/88x31/png/by-nc-sa.eu.png){fig-alt="cc license" width=128px}
  back-to-top-navigation: false
  bread-crumbs: false
  navbar:
    title: false
    logo: "metafiles/logo.jpg"
    logo-href: https://roots-research.group
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Research activities"
        href: activities.qmd#
      - text: "Outcomes"
        href: outcomes.qmd
      - text: "Members"
        href: members.qmd
      - text: "Events"
        menu:
        - text: "Upcoming events"
          href: ./events/upcoming.qmd
        - text: "Past events"
          href: ./events/past.qmd


    right:
      - icon: globe
        href: https://roots-research.group

format:
  html:
    page-layout: full
    theme: 
      light: minty
      dark: superhero
    css: styles.css 
    toc: true
    html-math-method: mathjax
    include-in-header:
      - text: |
          <script>
          MathJax = {
            tex: {
              tags: 'ams'
            }
          };
          </script>

pdf-engine: xelatex

execute: 
  freeze: auto



